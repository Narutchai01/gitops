name: Node Quality
description: Install npm dependencies and run the project's lint script.
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run lint
