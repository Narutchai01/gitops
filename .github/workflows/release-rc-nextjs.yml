name: Release Candidate Next.js

on:
  workflow_call:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-rc-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare RC Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from branch
        id: version
        uses: narutchai01/gitops/.github/actions/prepare-rc@main
        with:
          release-branch: ${{ github.ref_name }}

  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    needs:
      - prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: narutchai01/gitops/.github/actions/node-quality@main
        with:
          node-version: 24

      # - name: Type check
      #   run: npm run typecheck

      # - name: Test
      #   run: npm test

  build:
    name: Build Next.js Image
    runs-on: ubuntu-latest

    needs:
      - prepare
      - quality

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and push
        id: build
        uses: narutchai01/gitops/.github/actions/build-image@main
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  create-tag:
    name: Create RC Release
    runs-on: ubuntu-latest

    needs:
      - prepare
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create RC release
        uses: narutchai01/gitops/.github/actions/create-release@main
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          prerelease: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "### Release Candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`${{ needs.prepare.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ needs.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
