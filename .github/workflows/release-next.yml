name: Production Release

on:
  workflow_call:
    inputs:
      release-branch:
        description: Release branch, e.g. release/1.4.0
        required: true
        type: string

      release-sha:
        description: Release branch HEAD SHA
        required: true
        type: string

      main-sha:
        description: Main merge commit SHA
        required: true
        type: string

      allow-package-version-change:
        description: Allow package.json version metadata to differ from the tested RC
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare Production Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release.outputs.version }}
      rc-tag: ${{ steps.release.outputs.rc-tag }}
      final-tag: ${{ steps.release.outputs.final-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare production release
        id: release
        uses: narutchai01/gitops/.github/actions/prepare-production@main
        with:
          release-branch: ${{ inputs.release-branch }}
          release-sha: ${{ inputs.release-sha }}
          main-sha: ${{ inputs.main-sha }}
          allow-package-version-change: ${{ inputs.allow-package-version-change }}

  promote:
    name: Promote Docker Image
    needs:
      - prepare

    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.promote.outputs.digest }}

    steps:
      - name: Promote RC image
        id: promote
        uses: narutchai01/gitops/.github/actions/promote-image@main
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          rc-tag: ${{ needs.prepare.outputs.rc-tag }}
          final-tag: ${{ needs.prepare.outputs.final-tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create Production Release
    needs:
      - prepare
      - promote

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create production release
        uses: narutchai01/gitops/.github/actions/create-release@main
        with:
          tag: ${{ needs.prepare.outputs.final-tag }}
          sha: ${{ inputs.main-sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        shell: bash
        run: |
          echo "### Production Release 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "RC: \`${{ needs.prepare.outputs.rc-tag }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "Release: \`${{ needs.prepare.outputs.final-tag }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "Digest: \`${{ needs.promote.outputs.digest }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Production uses the same artifact tested in RC." \
            >> "$GITHUB_STEP_SUMMARY"
